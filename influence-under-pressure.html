<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Influence Under Pressure - Eloqaura</title>
  <link rel="icon" href="logo.png" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0c0038;
      color: #FFFFFF;
    }
    .main-container {
      max-width: 950px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }
    .main-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      color: #FFD700;
      margin-bottom: 1rem;
    }
    .main-header h2 {
      font-family: 'Open Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 3rem;
    }
    .experience-section h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      color: #FFD700;
      margin-bottom: 2rem;
    }
    .experience-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
      text-align: left;
    }
    .experience-item {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }
    .experience-icon {
      border: 1px solid #FFD700;
      padding: 0.8rem;
      border-radius: 5px;
      font-size: 1.5rem;
      color: #FFD700;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .experience-content h4 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }
    .comparison-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 3rem;
      text-align: left;
    }
    .column h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      color: #FFD700;
      margin-bottom: 1rem;
    }
    .column ul {
      list-style: none;
      padding: 0;
    }
    .column li {
      margin-bottom: 1rem;
      position: relative;
      padding-left: 1.5rem;
    }
    .column li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #FFD700;
    }
    .testimonial-box {
      border: 1px solid #FFD700;
      padding: 2rem;
      border-radius: 10px;
      font-style: italic;
      background-color: #0c0038;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const App = () => {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

      const toggleMobileMenu = () => {
        setIsMobileMenuOpen(!isMobileMenuOpen);
      };

      return (
        <>
          {/* Navigation */}
          <nav>
            <div className="brand">
              <a href="index.html">
                <img src="logo.png" alt="Eloqaura Logo" style={{ width: '55px', height: '55px' }} />
              </a>
              <p className="brand-name">ELOQAURA</p>
            </div>
            <div>
              <div className={`nav-links ${isMobileMenuOpen ? 'active' : ''}`}>
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#programs">Programs</a>
                <a href="index.html#resources">Resources</a>
                <a href="index.html#contact">Contact</a>
              </div>
              <div className="hamburger-menu" onClick={toggleMobileMenu}>
                <i className="fas fa-bars"></i>
              </div>
            </div>
          </nav>

          <div className="main-container">
            <div className="main-header">
              <h1>INFLUENCE UNDER PRESSURE™</h1>
              <h2>Stay calm, clear, and convincing when the stakes are highest.</h2>
            </div>

            <div className="experience-section">
              <h3>WHAT YOU'LL EXPERIENCE</h3>
              <div className="experience-grid">
                <div className="experience-item">
                  <div className="experience-icon"><i className="fas fa-user-secret"></i></div>
                  <div className="experience-content">
                    <h4>Crisis Simulations</h4>
                    <p>Mock press briefings, investor calls, and hostile Q&As that test real-time composure</p>
                  </div>
                </div>
                <div className="experience-item">
                  <div className="experience-icon"><i className="fas fa-chess-board"></i></div>
                  <div className="experience-content">
                    <h4>Boardroom Battle Drills</h4>
                    <p>Roleplay high-stakes decisions where clarity and confidence sway outcomes</p>
                  </div>
                </div>
                <div className="experience-item">
                  <div className="experience-icon"><i className="fas fa-fire-extinguisher"></i></div>
                  <div className="experience-content">
                    <h4>Message Under Fire™ Framework</h4>
                    <p>Learn to simplify, prioritize, and deliver your message under intense scrutiny</p>
                  </div>
                </div>
                <div className="experience-item">
                  <div className="experience-icon"><i className="fas fa-hand-holding-heart"></i></div>
                  <div className="experience-content">
                    <h4>Pressure Presence Coaching</h4>
                    <p>Techniques to regulate nerves, manage tone, and use body language strategically</p>
                  </div>
                </div>
              </div>
            </div>

            <div className="comparison-section">
              <div className="column">
                <h3>BEFORE</h3>
                <ul>
                  <li>Reactive, defensive responses</li>
                  <li>Messages lost under stress</li>
                  <li>Visible nerves undermining authority</li>
                  <li>Difficulty influencing tough stakeholders</li>
                </ul>
              </div>
              <div className="column">
                <h3>AFTER</h3>
                <ul>
                  <li>Composed, centered, and strategic under fire</li>
                  <li>Clear messages that drive decisions</li>
                  <li>Confidence that reassures teams and stakeholders</li>
                  <li>Authority balanced with empathy, even in conflict</li>
                </ul>
              </div>
            </div>

            <div className="testimonial-box">
              <p>A senior executive facing a hostile media panel walked away not just intact — but admired. By applying Influence Under Pressure™, they shifted the conversation from blame to vision, regaining trust for the organization.</p>
            </div>
          </div>

          {/* Footer */}
          <footer id="contact">
            <h2>Contact Us</h2>
            <div className="contact-form">
              <form>
                <input type="text" placeholder="Your Name" />
                <input type="email" placeholder="Your Email" />
                <textarea placeholder="Your Message"></textarea>
                <button type="submit">Send Message</button>
              </form>
            </div>
            <p><span className="email">Email: kiranlingaraj@eloqaura.com</span> | <span className="phone">Phone: +91 78240 05002</span></p>
            <div className="social-media">
              <a href="#"><i className="fab fa-twitter"></i></a>
              <a href="#"><i className="fab fa-linkedin-in"></i></a>
              <a href="#"><i className="fab fa-facebook-f"></i></a>
            </div>
            <p><span className="copyright">&copy; {new Date().getFullYear()} Eloqaura Communication Training</span> | <span className="back-to-top"><a href="#home">Back to Top</a></span></p>
          </footer>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
