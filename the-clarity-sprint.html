<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Clarity Sprint - Eloqaura</title>
  <link rel="icon" href="logo.png" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0c0038;
      color: #F5F5F5;
      font-family: 'Open Sans', sans-serif;
    }
    .main-container {
      max-width: 950px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }
    .main-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    .main-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      color: #FFD700;
      margin-bottom: 1rem;
      font-weight: 400;
    }
    .main-header h2 {
      font-size: 1.5rem;
      font-weight: 400;
      color: #FFD700;
    }
    .experience-section {
        border: 1px solid #FFD700;
        padding: 2rem;
        border-radius: 10px;
        margin-bottom: 3rem;
    }
    .experience-section h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      color: #FFD700;
      margin-bottom: 2rem;
      text-align: center;
    }
    .experience-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
    }
    .experience-item {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
    }
    .experience-item i {
        font-size: 1.5rem;
        color: #FFD700;
        margin-top: 5px;
    }
    .comparison-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-bottom: 3rem;
    }
    .column h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      color: #FFD700;
      margin-bottom: 1.5rem;
    }
    .column ul {
      list-style: none;
      padding: 0;
    }
    .column li {
      position: relative;
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }
    .column li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #FFD700;
    }
    .impact-story {
      font-style: italic;
      margin-bottom: 3rem;
    }
    .bottom-cta {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .bottom-cta h3 {
        font-family: 'Montserrat', sans-serif;
        font-size: 1.2rem;
        text-transform: uppercase;
        color: #FFD700;
    }
    .cta-buttons {
      display: flex;
      gap: 1rem;
    }
    .cta-btn {
      display: inline-block;
      border: 1px solid #FFD700;
      padding: 0.8rem 1.5rem;
      border-radius: 5px;
      background-color: #FFD700;
      color: #0c0038;
      text-decoration: none;
      font-size: 1rem;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }
    .cta-btn:hover {
      background-color: transparent;
      color: #FFD700;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const App = () => {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

      const toggleMobileMenu = () => {
        setIsMobileMenuOpen(!isMobileMenuOpen);
      };

      return (
        <>
          {/* Navigation */}
          <nav>
            <div className="brand">
              <a href="index.html">
                <img src="logo.png" alt="Eloqaura Logo" style={{ width: '55px', height: '55px' }} />
              </a>
              <p className="brand-name">ELOQAURA</p>
            </div>
            <div>
              <div className={`nav-links ${isMobileMenuOpen ? 'active' : ''}`}>
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#programs">Programs</a>
                <a href="index.html#resources">Resources</a>
                <a href="index.html#contact">Contact</a>
              </div>
              <div className="hamburger-menu" onClick={toggleMobileMenu}>
                <i className="fas fa-bars"></i>
              </div>
            </div>
          </nav>

          <div className="main-container">
            <div className="main-header">
              <h1>THE CLARITY SPRINT™</h1>
              <h2>Cut through complexity. Align fast. Deliver results.</h2>
            </div>

            <div className="experience-section">
              <h3>WHAT YOU'LL EXPERIENCE</h3>
              <div className="experience-grid">
                <div className="experience-item">
                  <i className="fas fa-clock"></i>
                  <div>
                    <h4>Message-in-a-minute drills™</h4>
                    <p>Practice condensing complex ideas into concise, memorable points</p>
                  </div>
                </div>
                <div className="experience-item">
                  <i className="fas fa-users"></i>
                  <div>
                    <h4>Alignment races</h4>
                    <p>Competitive exercises where teams must agree on priorities under strict time limits</p>
                  </div>
                </div>
                <div className="experience-item">
                  <i className="fas fa-project-diagram"></i>
                  <div>
                    <h4>Decision clarity circuits™</h4>
                    <p>Rotating roleplays to test quick, structured decision-making</p>
                  </div>
                </div>
                <div className="experience-item">
                  <i className="fas fa-th"></i>
                  <div>
                    <h4>Action sprint boards</h4>
                    <p>Visual tools to translate dialogue into actionable next steps</p>
                  </div>
                </div>
              </div>
            </div>

            <div className="comparison-section">
              <div className="column">
                <h3>BEFORE</h3>
                <ul>
                  <li>Long discussions with unclear outcomes</li>
                  <li>Over-analysis leading to slow decisions</li>
                  <li>Critical points buried in complexity</li>
                </ul>
              </div>
              <div className="column">
                <h3>AFTER</h3>
                <ul>
                  <li>Fast, focused communication</li>
                  <li>Decisions made quickly with by-in</li>
                  <li>Clear, actionable priorities</li>
                  <li>Energised teams with renewed momentum</li>
                </ul>
              </div>
            </div>

            <p className="impact-story">
              A technology team overwhelmed by endless planning meetings used The Clarity Sprint™. Within two sessions, they reduced discussion time by 40% and left every meeting with agreed priorities and next steps.
            </p>

            <div className="bottom-cta">
                <h3>EXPERIENTIAL EDGE</h3>
                <div className="cta-buttons">
                    <a href="#" className="cta-btn">CUT THROUGH THE NOISE</a>
                    <a href="#" className="cta-btn">BOOK A WORKSHOP</a>
                </div>
            </div>

          </div>

          {/* Footer */}
          <footer id="contact">
            <h2>Contact Us</h2>
            <div className="contact-form">
              <form>
                <input type="text" placeholder="Your Name" />
                <input type="email" placeholder="Your Email" />
                <textarea placeholder="Your Message"></textarea>
                <button type="submit">Send Message</button>
              </form>
            </div>
            <p><span className="email">Email: kiranlingaraj@eloqaura.com</span> | <span className="phone">Phone: +91 78240 05002</span></p>
            <div className="social-media">
              <a href="#"><i className="fab fa-twitter"></i></a>
              <a href="#"><i className="fab fa-linkedin-in"></i></a>
              <a href="#"><i className="fab fa-facebook-f"></i></a>
            </div>
            <p><span className="copyright">&copy; {new Date().getFullYear()} Eloqaura Communication Training</span> | <span className="back-to-top"><a href="#home">Back to Top</a></span></p>
          </footer>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
